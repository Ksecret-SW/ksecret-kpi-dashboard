<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ksecret KPI manage Board</title>
<style>
:root{
  --ink:#1B1A2E; --ink-2:#4A4763; --ink-3:#73708A;
  --ground:#F6F5FA; --surface:#FFFFFF; --surface-2:#FBFAFE;
  --line:#CDCADE; --line-2:#B9B5CE; --tick:#857DAB;
  --accent:#5B4BC4; --on-accent:#FFFFFF; --accent-soft:#EDEAFB;
  --gangnam:#7C6BD9; --seongnam:#C4703A; --gwanggyo:#2F8F6B;
  --good:#2C7A57; --good-bg:#E3F2EA;
  --warn:#865F0C; --warn-bg:#FBF1D8;
  --crit:#B33C36; --crit-bg:#FBE5E3;
  --idle:#9A97AD; --idle-bg:#EDECF2;
  --track:#E7E5F0;
  --band-bad:#F0CDCC; --band-ok:#F0E4CC; --band-good:#EBF9F3;
  --series-1:#2a78d6; --series-2:#eb6834; --series-3:#1baf7a;   /* dataviz 검증 통과 (blue/orange/aqua) */
  /* 영업이익은 매출의 4번째 범주가 아니라 다른 측정치다. 범주 색을 쓰면 동급으로
     읽히고 palette 4~8번 슬롯은 주황·아쿠아와 ΔE 가 부족해 실제로 구별되지 않는다.
     중립 잉크 + 점선 + 우측 축으로 '참조 계열'임을 드러낸다. 대비 8.9:1. */
  --series-profit:#4A4763;
  --chart-grid:#e1e0d9; --chart-axis:#c3c2b7;
  --scrim:rgba(20,18,38,.55);
  --shadow:0 1px 2px rgba(27,26,46,.05), 0 8px 24px -12px rgba(27,26,46,.14);
  --shadow-lg:0 24px 60px -20px rgba(27,26,46,.42);
  --mono:"Cascadia Mono",Consolas,"SF Mono",ui-monospace,monospace;
  --sans:"Pretendard","Malgun Gothic","맑은 고딕","Apple SD Gothic Neo",
         -apple-system,system-ui,"Segoe UI",sans-serif;
  --bar:88px;          /* 인라인 진도율 바 — 전 계층 동일 폭 */
  --val:54px;          /* 진도율 숫자 칸 — 전 계층 동일 폭 */
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ink:#EFEDF7; --ink-2:#B4B0C8; --ink-3:#8A85A4;
  --ground:#12111F; --surface:#1C1A2E; --surface-2:#221F38;
  --line:#403B5E; --line-2:#4E4870; --tick:#776FA3;
  --accent:#A99BF5; --on-accent:#17142B; --accent-soft:#2A2547;
  --gangnam:#9C8DEB; --seongnam:#DE9257; --gwanggyo:#4FB88C;
  --good:#6ED3A3; --good-bg:#1B3A2C;
  --warn:#E5BA55; --warn-bg:#3A3018;
  --crit:#F09189; --crit-bg:#3D1F1D;
  --idle:#7C7894; --idle-bg:#272338;
  --track:#2C2844;
  --band-bad:#2B1917; --band-ok:#322B1B; --band-good:#12211A;
  --series-1:#3987e5; --series-2:#d95926; --series-3:#199e70;
  --series-profit:#B4B0C8;
  --chart-grid:#2c2c2a; --chart-axis:#383835;
  --scrim:rgba(0,0,0,.66);
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.6);
  --shadow-lg:0 24px 60px -20px rgba(0,0,0,.8);
}}
:root[data-theme="dark"]{
  --ink:#EFEDF7; --ink-2:#B4B0C8; --ink-3:#8A85A4;
  --ground:#12111F; --surface:#1C1A2E; --surface-2:#221F38;
  --line:#403B5E; --line-2:#4E4870; --tick:#776FA3;
  --accent:#A99BF5; --on-accent:#17142B; --accent-soft:#2A2547;
  --gangnam:#9C8DEB; --seongnam:#DE9257; --gwanggyo:#4FB88C;
  --good:#6ED3A3; --good-bg:#1B3A2C;
  --warn:#E5BA55; --warn-bg:#3A3018;
  --crit:#F09189; --crit-bg:#3D1F1D;
  --idle:#7C7894; --idle-bg:#272338;
  --track:#2C2844;
  --band-bad:#2B1917; --band-ok:#322B1B; --band-good:#12211A;
  --series-1:#3987e5; --series-2:#d95926; --series-3:#199e70;
  --series-profit:#B4B0C8;
  --chart-grid:#2c2c2a; --chart-axis:#383835;
  --scrim:rgba(0,0,0,.66);
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.6);
  --shadow-lg:0 24px 60px -20px rgba(0,0,0,.8);
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--sans);
  font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
.wrap{max-width:1320px;margin:0 auto;padding:26px 22px 90px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.eyebrow{font-size:10.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}

/* ---------- header ---------- */
header{display:flex;flex-wrap:wrap;gap:18px;align-items:flex-end;
  justify-content:space-between;padding-bottom:18px;border-bottom:1px solid var(--line)}
h1{margin:4px 0 2px;font-size:23px;font-weight:800;letter-spacing:-.02em}
.sub{color:var(--ink-2);font-size:12.5px}
.srcbox{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.srlabel{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
input[type=text]{font:inherit;font-size:12.5px;padding:9px 10px;min-height:40px;
  width:260px;max-width:100%;border:1px solid var(--line-2);border-radius:7px;
  background:var(--surface);color:var(--ink)}
input[type=text]::placeholder{color:var(--ink-3)}
button{font:inherit;font-size:12.5px;font-weight:600;cursor:pointer;padding:9px 14px;
  min-height:40px;border-radius:7px;border:1px solid var(--line-2);
  background:var(--surface);color:var(--ink);
  transition:border-color .16s ease,color .16s ease,filter .16s ease,background-color .16s ease}
button:hover{border-color:var(--accent);color:var(--accent)}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
button.primary:hover{filter:brightness(1.08);color:var(--on-accent)}
button[disabled]{opacity:.5;cursor:not-allowed}
button[disabled]:hover{border-color:var(--line-2);color:var(--ink)}
#themeBtn{min-width:40px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.srcstate{font-size:11.5px;color:var(--ink-3);display:flex;align-items:center;gap:6px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--idle);flex:none}
.dot.live{background:var(--good)} .dot.err{background:var(--crit)}
.dot.busy{background:var(--accent);animation:pulse 1s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}

/* ---------- 전사 요약 ---------- */
.total{display:grid;gap:14px;margin:20px 0 22px;
  grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;
  box-shadow:var(--shadow);padding:17px 20px 15px}
.stat.hero{border-color:var(--accent)}
.stat .st{display:flex;gap:10px;align-items:baseline;justify-content:space-between}
.stat .big{font-size:40px;font-weight:800;letter-spacing:-.04em;line-height:1.05}
.stat .big small{font-size:16px;font-weight:600;margin-left:2px;color:var(--ink-2)}
.stat .goal{font-family:var(--mono);font-variant-numeric:tabular-nums;
  font-size:12px;color:var(--ink-3);text-align:right;line-height:1.5}
.stat .goal b{display:block;font-size:14px;font-weight:700;color:var(--ink-2)}
.stat .cap{font-size:11.5px;color:var(--ink-3);margin-top:7px}
.stat .gwrap{margin-top:11px}
.scale{display:flex;gap:13px;flex-wrap:wrap;margin-top:10px;font-size:10.5px;color:var(--ink-3)}
.scale i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px;
  vertical-align:-1px;border:1px solid var(--line)}
.scale .tickleg i{width:2px;height:11px;border:0;background:var(--tick);border-radius:1px}

/* ---------- 불릿 게이지 ---------- */
.gauge{position:relative;height:10px;border-radius:99px;overflow:hidden;background:var(--track)}
.gauge>u{position:absolute;top:0;bottom:0;display:block}
.gauge>u.b1{left:0;width:58.333%;background:var(--band-bad)}
.gauge>u.b2{left:58.333%;width:16.667%;background:var(--band-ok)}
.gauge>u.b3{left:75%;right:0;background:var(--band-good)}
.gauge>i{position:absolute;top:2px;bottom:2px;left:0;border-radius:99px;display:block}
.gauge>b{position:absolute;top:0;bottom:0;left:83.333%;width:2px;background:var(--tick)}
.gauge.sm{height:7px}
.gauge.sm>i{top:1.5px;bottom:1.5px}
.gauge.sm>u{display:none}   /* 인라인 바는 비교용 스파크라인 — 구간 밴드는 요약에만 */
.fill-good{background:var(--good)} .fill-warn{background:var(--warn)}
.fill-crit{background:var(--crit)} .fill-idle{background:var(--idle)}

/* ---------- 툴바 ---------- */
.toolbar{display:flex;gap:12px;align-items:center;justify-content:space-between;
  flex-wrap:wrap;margin:0 0 12px}
.tbinfo{font-size:12px;color:var(--ink-3)}
.toolbar button{min-height:34px;padding:7px 13px;font-size:12px}

/* ---------- 매출 추이 차트 ---------- */
.chartcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;
  box-shadow:var(--shadow);padding:17px 20px 14px;margin:0 0 22px}
.chartcard .chd{display:flex;justify-content:space-between;align-items:baseline;
  flex-wrap:wrap;gap:10px;margin-bottom:4px}
.chartcard h2{font-size:13px;font-weight:800;margin:0;letter-spacing:-.01em}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:11.5px;color:var(--ink-2)}
.legend .key{display:inline-flex;align-items:center;gap:6px}
.legend .swatch{width:14px;height:2px;border-radius:1px;display:inline-block}
.chartwrap{overflow-x:auto}
.linechart{width:100%;height:auto;min-width:420px}
.linechart .grid{stroke:var(--chart-grid);stroke-width:1}
.linechart .axis{stroke:var(--chart-axis);stroke-width:1}
.linechart .tick{font-size:10.5px;fill:var(--ink-3)}
.linechart .line{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.linechart .line.dash{stroke-dasharray:5 4;stroke-width:1.8}
.linechart .tick.lower{fill:var(--series-profit)}
.linechart .bandlab{font-size:10.5px;font-weight:700;fill:var(--series-profit)}
.legend .swatch.dash{height:0;border-top:2px dashed currentColor;background:none!important;
  border-radius:0;width:16px;align-self:center}
.legend .axnote{color:var(--ink-3);font-size:10.5px;margin-left:3px}
.linechart .dot{stroke:var(--surface);stroke-width:2}
.linechart .hit{fill:transparent;cursor:crosshair}
.linechart .crosshair{stroke:var(--ink-3);stroke-width:1;stroke-dasharray:3 3;
  opacity:0;pointer-events:none}
.charttip{position:absolute;pointer-events:none;background:var(--surface);
  border:1px solid var(--line-2);border-radius:8px;box-shadow:var(--shadow-lg);
  padding:8px 10px;font-size:11.5px;opacity:0;transition:opacity .1s ease;
  min-width:120px;z-index:5}
.charttip .tt-x{font-weight:700;margin-bottom:4px;color:var(--ink)}
.charttip .tt-row{display:flex;align-items:center;gap:6px;justify-content:space-between}
.charttip .tt-key{display:flex;align-items:center;gap:5px;color:var(--ink-2)}
.charttip .tt-line{width:10px;height:2px;border-radius:1px;display:inline-block}
.charttip .tt-val{font-family:var(--mono);font-variant-numeric:tabular-nums;
  font-weight:700;color:var(--ink)}
.chartcap{font-size:11px;color:var(--ink-3);margin-top:6px}

/* ---------- 캠퍼스 3열 ---------- */
.campuses{display:grid;gap:16px;grid-template-columns:repeat(3,minmax(0,1fr));align-items:start}
.col{display:flex;flex-direction:column;gap:11px;min-width:0}
.chead{display:grid;grid-template-columns:14px 1fr var(--val) var(--bar);gap:10px;
  align-items:center;padding:11px 15px;border-radius:11px;
  background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow)}
.chead .cn{font-size:13px;font-weight:800;letter-spacing:.02em}
.chead .cs{font-size:11px;color:var(--ink-3);display:block;font-weight:400;letter-spacing:0}
.chead .cv{font-family:var(--mono);font-variant-numeric:tabular-nums;
  font-size:15px;font-weight:800;text-align:right}

/* ---------- 팀 카드 ---------- */
.tblock{background:var(--surface);border:1px solid var(--line);border-radius:11px;
  box-shadow:var(--shadow);overflow:hidden}
.thead{display:grid;grid-template-columns:14px 1fr var(--val) var(--bar);gap:10px;
  align-items:center;padding:11px 15px;background:var(--surface-2);
  border:0;border-bottom:1px solid var(--line);border-radius:0;
  width:100%;text-align:left;font:inherit;color:inherit;cursor:pointer;min-height:auto;
  transition:background-color .16s ease}
.thead:hover{background:var(--accent-soft)}
.thead .caret{color:var(--ink-3);font-size:10px;line-height:1}
.tflags{grid-column:2/-1}
.tblock.collapsed .thead{border-bottom:0}
.tname{font-size:14.5px;font-weight:750;letter-spacing:-.01em}
.tmeta{font-size:11px;color:var(--ink-3);display:block}
.tv{font-family:var(--mono);font-variant-numeric:tabular-nums;
  font-size:15px;font-weight:800;text-align:right}
.tflags{grid-column:1/-1;margin-top:2px}

.chip{display:inline-block;font-size:10px;font-weight:650;padding:2px 6px;
  border-radius:5px;margin:1px 3px 1px 0;white-space:nowrap}
.chip.good{background:var(--good-bg);color:var(--good)}
.chip.warn{background:var(--warn-bg);color:var(--warn)}
.chip.crit{background:var(--crit-bg);color:var(--crit)}
.chip.idle{background:var(--idle-bg);color:var(--ink-2)}
.chip.acc{background:var(--accent-soft);color:var(--accent)}
.chip.who{background:var(--accent-soft);color:var(--accent);font-weight:700}

/* ---------- KPI 행 ---------- */
.krow{display:grid;grid-template-columns:1fr var(--val) var(--bar);gap:10px;
  grid-template-areas:"name val bar" "sub val bar";
  align-items:center;padding:9px 15px;min-height:44px;width:100%;
  background:none;border:0;border-bottom:1px solid var(--line);border-radius:0;
  text-align:left;font:inherit;color:inherit;cursor:pointer;
  transition:background-color .16s ease}
.krow:hover{background:var(--accent-soft)}
.krow:last-child{border-bottom:0}
.krow.dup{background:var(--accent-soft)}
.kn{grid-area:name;font-weight:650;font-size:13px;line-height:1.35}
.ksub{grid-area:sub;font-family:var(--mono);font-variant-numeric:tabular-nums;
  font-size:11px;color:var(--ink-3);margin-top:2px}
.ksub .act{font-weight:700;color:var(--ink-2)}
.ksub .arrow{margin:0 4px}
.kv{grid-area:val;font-family:var(--mono);font-variant-numeric:tabular-nums;
  font-size:12.5px;font-weight:700;text-align:right;align-self:center}
.kg{grid-area:bar;align-self:center}
.emptyteam{padding:16px 15px;color:var(--ink-3);font-size:12px}

/* ---------- 플로팅 패널 (여러 개 동시 · 드래그 이동) ---------- */
#panels{position:fixed;inset:0;pointer-events:none;z-index:60}
.panel{position:absolute;width:min(430px,calc(100vw - 28px));pointer-events:auto;
  background:var(--surface);color:var(--ink);border:1px solid var(--line-2);
  border-radius:13px;box-shadow:var(--shadow-lg);overflow:hidden;
  display:flex;flex-direction:column;max-height:min(78vh,660px)}
.panel.front{border-color:var(--accent)}
.mhead{display:flex;gap:10px;align-items:flex-start;padding:13px 14px 11px;
  border-bottom:1px solid var(--line);background:var(--surface-2);
  cursor:grab;touch-action:none;user-select:none}
.mhead:active{cursor:grabbing}
.grip{flex:none;width:12px;align-self:stretch;margin:1px 0;border-radius:2px;
  background:repeating-linear-gradient(var(--line-2) 0 2px,transparent 2px 4px)}
.pcount{font-size:11.5px;color:var(--ink-3);margin-left:8px}
.closeall{margin-left:8px;padding:5px 10px;min-height:30px;font-size:11.5px}
.mhead .mt{flex:1;min-width:0}
.mkicker{font-size:11px;color:var(--ink-3);margin-bottom:3px}
.mtitle{font-size:15.5px;font-weight:750;letter-spacing:-.015em;line-height:1.35;margin:0}
.mclose{flex:none;width:32px;height:32px;min-height:32px;padding:0;border-radius:8px;
  font-size:14px;line-height:1;color:var(--ink-2);cursor:pointer}
.mbody{padding:14px 16px 18px;overflow-y:auto;flex:1}
.mrate{display:flex;gap:14px;align-items:center;margin-bottom:16px}
.mrate .mv{font-family:var(--mono);font-variant-numeric:tabular-nums;
  font-size:26px;font-weight:800;letter-spacing:-.03em;min-width:84px}
.mrate .mg{flex:1;min-width:120px}
.mfacts{display:grid;grid-template-columns:repeat(auto-fit,minmax(125px,1fr));gap:10px;margin:0 0 4px}
.fact{background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:9px 11px}
.fact dt{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  color:var(--ink-3);margin-bottom:3px}
.fact dd{margin:0;font-size:13px;font-weight:650;font-variant-numeric:tabular-nums}
.msec{font-size:10.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;
  color:var(--ink-3);margin:18px 0 7px}
.mwhy{font-size:13px;color:var(--ink-2);padding-left:11px;border-left:2px solid var(--accent)}
.formula{font-family:var(--mono);font-size:11.5px;color:var(--ink-2);background:var(--ground);
  border:1px solid var(--line);border-radius:7px;padding:8px 11px;
  overflow-x:auto;white-space:nowrap}
.persons{display:flex;flex-direction:column;gap:7px}
.prow{display:grid;gap:10px;align-items:center;
  grid-template-columns:60px 1fr 42px var(--bar);
  background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:9px 11px}
.prow .pnm{font-weight:650;font-size:12.5px}
.prow .pwhy{font-size:11.5px;color:var(--ink-3);margin-top:2px}
.prow .pv{font-family:var(--mono);font-variant-numeric:tabular-nums;
  font-size:12px;font-weight:700;text-align:right}
.nolink{font-size:12.5px;color:var(--crit)}
footer{margin-top:40px;padding-top:16px;border-top:1px solid var(--line);
  font-size:11.5px;color:var(--ink-3);display:flex;gap:18px;flex-wrap:wrap}

@media (max-width:1080px){ .campuses{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media (max-width:720px){
  .campuses{grid-template-columns:1fr}
  .panel{width:calc(100vw - 20px);max-height:74vh}
  .mhead{cursor:default}
  .wrap{padding:16px 13px 60px}
  .srcbox{width:100%}
  .srcbox input[type=text]{flex:1 1 100%}
  button{min-height:44px} #themeBtn{min-width:44px}
  .total{padding:16px} .total .big{font-size:42px}
  .prow{grid-template-columns:60px 1fr}
  .prow .pw,.prow .pv{display:none}
}
@media (max-width:400px){ :root{--bar:64px;--val:48px} h1{font-size:20px} }
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="wrap">
<header>
  <div>
    <div class="eyebrow">Ksecret · 팀 KPI · 개인 KPI 연동</div>
    <h1>KPI manage Board · 11~12월</h1>
    <div class="sub" id="periodLine"></div>
  </div>
  <div class="srcbox">
    <label for="sheetUrl" class="srlabel">구글시트 주소</label>
    <input type="text" id="sheetUrl" placeholder="구글시트 URL 또는 ID 붙여넣기">
    <button class="primary" id="loadBtn" type="button">시트에서 불러오기</button>
    <button id="themeBtn" type="button" aria-label="라이트·다크 모드 전환" title="라이트·다크 전환">◐</button>
    <div class="srcstate"><span class="dot" id="srcDot"></span><span id="srcText">시트 연결 중…</span></div>
  </div>
</header>

<section class="total" id="total"></section>
<section class="chartcard" id="revChart"></section>
<div class="toolbar">
  <span class="tbinfo" id="tbInfo"></span>
  <button id="foldBtn" type="button">전체 펼치기</button>
</div>
<div class="campuses" id="view"></div>

<footer>

<script>
const DATA = {"period":"2026-11-01 ~ 2026-12-31","asOf":"","teams":[],"rows":[]};
/* 실제 서비스 배포 시 여기에 구글시트 ID(또는 URL)를 넣으면 방문자가 매번 붙여넣지 않고
   자동으로 최신 데이터를 불러온다. 비워두면 샘플 데이터로 열린다. */
const DEFAULT_SHEET_ID = "172onAyg5UfcEdzBB1q_I5wNbugjvDTdMHX_qH9GNTLk";
/* SR 대시보드와 같은 오리진에 올라가도 시트 ID가 섞이지 않도록 키를 분리한다. */
const LS_KEY = "ksecret_kpi_board_sheet";
const CAMPUS_ORDER = ["Business","Distribution","Strategy"];
const CAMPUS_VAR = {"Business":"--gangnam","Distribution":"--seongnam","Strategy":"--gwanggyo"};
const WEEK_LABELS = ["11/2","11/9","11/16","11/23","11/30","12/7","12/14","12/21","12/28"];
const HEADLINE_LABEL = {
  "전사 매출 합계": "전사 매출",
  "IDENEL 매출": "IDENEL 누적 매출",
  "OEM 매출": "OEM 누적 매출",
  "전사 영업이익 합계": "전사 영업이익",
};
const TYPE_LABEL = {R:"달성형 (Ratio)",L:"개선형 (Linear)",D:"일정형 (Deadline)",
                    M:"마일스톤형 (Milestone)",G:"가드레일 (Guardrail)"};
let state = {data:DATA, collapsed:new Set(), panels:new Map(), z:60, cascade:0};
/* 팀 목록이 길어 기본은 접힘으로 둔다. 팀 이름·진도율만 훑고 필요한 팀만 펼친다. */
const collapseAll = () => { state.collapsed = new Set(state.data.teams.map(t=>t.team)); };
const expandAll   = () => { state.collapsed.clear(); };
collapseAll();

/* ---------- 가드레일 판정 ----------
   SR 운영에서 얻은 교훈: 체크박스 문자열("FALSE")은 JS에서 truthy 라 전 행이 가드레일로
   오판된다. Ksecret 은 처음부터 측정유형 "G" 문자열 비교 하나로만 판정한다. */
function isGuard(r){ return !!(r && r.type === "G"); }

/* ---------- 진도율: 시트 '달성률' 열과 같은 분기 ----------
   시트가 계산한 값(sheetRate)을 우선 쓰고, 없으면 같은 공식으로 여기서 계산한다.
   R 실적÷목표 / L (실적−기준선)÷(목표−기준선) / D 100−지연일수×감점률 /
   M 완료 단계 합 / G −위반 건수×감점률(차감, 클램프 없음) */
function rateOf(r){
  if(typeof r.sheetRate === "number") return r.sheetRate;
  const num = v => (v===null||v===undefined||v==="") ? null : Number(v);
  const cl = v => Math.max(0, Math.min(120, v));
  const a = num(r.actual);
  if(a===null || !r.type) return null;
  switch(r.type){
    case "G": return -a*(num(r.ded)??0);
    case "D": return cl(100 - a*(num(r.ded)??0));
    case "M": return cl(a);
    case "L": { const lo=num(r.low), tg=num(r.target);
      if(lo===null) return "기준선 필요"; if(tg===null) return "목표값 필요";
      if(tg===lo) return "산식확인"; return cl((a-lo)/(tg-lo)*100); }
    default: { const tg=num(r.target);
      if(tg===null) return "목표값 필요"; if(tg===0) return "산식확인"; return cl(a/tg*100); }
  }
}
const numRate = v => typeof v==="number" ? v : null;

function fmt(n){
  if(n===null||n===undefined||n==="") return "·";
  if(typeof n!=="number") return String(n);
  const ab=Math.abs(n);
  if(ab>=1e8) return (n/1e8).toFixed(ab>=1e9?1:2).replace(/\.?0+$/,"")+"억";
  if(ab>=1e4) return n.toLocaleString("ko-KR");
  return (Math.round(n*100)/100).toLocaleString("ko-KR");
}
const pct = v => v===null ? "—" : (Math.round(v*10)/10).toFixed(1)+"%";
const band = v => v===null ? "idle" : v>=90?"good":v>=70?"warn":"crit";
const BAND_KO = {good:"양호", warn:"보통", crit:"미흡", idle:"미기재"};
const esc = s => String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const col = b => b==="idle" ? "var(--ink-3)" : `var(--${b})`;

/* 목표가 무엇이었는지 리마인드하는 한 줄 */
function targetLine(r){
  if(r.level==="팀")
    return `목표 <span class="act">${esc(r.targetText||"미설정")}</span>` +
      (r.kids?`<span class="arrow">·</span>개인 KPI ${r.kids}개 연결`:"");
  if(r.level==="사람")
    return `KPI ${r.rows.length}개 · 실적 입력 ${r.rows.filter(x=>numRate(x.rate)!==null).length}개`;
  if(isGuard(r))
    return `위반 <span class="act">${r.actual==null?"0":fmt(r.actual)}</span>건<span class="arrow">×</span>${fmt(r.ded)}%p`;
  switch(r.type){
    case "D": return `${esc(r.targetText||"")}<span class="arrow">·</span>지연 <span class="act">${
      r.actual==null?"미기재":fmt(r.actual)+"일"}</span>`;
    case "M": return `완료 단계 <span class="act">${r.actual==null?"미기재":fmt(r.actual)}</span><span class="arrow">/</span>100`;
    default:
      if(r.target===null||r.target===undefined)
        return `<span style="color:var(--crit)">목표값 미설정</span> · ${esc(r.targetText||"")}`;
      return `${fmt(r.target)}${r.type==="L"?` (기준 ${r.low==null?"미설정":fmt(r.low)})`:""}`+
        `<span class="arrow">←</span><span class="act">${r.actual==null?"미기재":fmt(r.actual)}</span>`;
  }
}
function formulaText(r){
  const f=x=>x===null||x===undefined?"·":(typeof x==="number"?fmt(x):esc(x));
  if(r.level==="팀") return `${esc(r.why||"")}\n대시보드 진도율 = 연결된 개인 KPI 달성률 평균`;
  switch(r.type){
    case "R": return `(${f(r.actual)} ÷ ${f(r.target)}) × 100`;
    case "L": return `(${f(r.actual)} − ${f(r.low)}) ÷ (${f(r.target)} − ${f(r.low)}) × 100`;
    case "D": return `100 − (지연 ${f(r.actual)}일 × ${f(r.ded)}%p)`;
    case "M": return `완료 단계 가중치 합 ${f(r.actual)} / 100`;
    case "G": return `− (위반 ${f(r.actual)}건 × ${f(r.ded)}%p)  ← 개인 진도율에서 차감`;
    default: return "측정유형 미지정";
  }
}

/* ---------- 집계 ----------
   개인 진도율 = Σ(비중 × 달성률) ÷ Σ(실적 있는 항목의 비중) + 가드레일 차감 (0~120)
   팀 진도율   = 구성원 개인 진도율의 평균
   팀 KPI 진도율 = 그 팀 KPI 에 연결된(상위 팀KPI) 개인 KPI 달성률의 평균 — 자동 롤업 */
function personRate(rows){
  const w = rows.filter(r=>!isGuard(r) && numRate(r.rate)!==null);
  const ws = w.reduce((s,r)=>s+(Number(r.weight)||0),0);
  if(!ws) return null;
  const g = rows.filter(isGuard).reduce((s,r)=>s+(numRate(r.rate)||0),0);
  return Math.max(0, Math.min(120, w.reduce((s,r)=>s+(Number(r.weight)||0)*r.rate,0)/ws + g));
}
function teamStats(team){
  const rows = state.data.rows.filter(r=>r.team===team);
  const tRows = rows.filter(r=>r.level==="팀");
  const pRows = rows.filter(r=>r.level==="개인" && r.name);
  const owners = [...new Set(pRows.map(r=>r.owner))];
  const people = owners.map(o=>{
    const pr = pRows.filter(r=>r.owner===o);
    const wsum = pr.filter(r=>!isGuard(r)).reduce((a,r)=>a+(Number(r.weight)||0),0);
    return {level:"사람", team, owner:o, name:o, kpiId:`P|${team}|${o}`, rows:pr,
            rate:personRate(pr), wsum};
  });
  tRows.forEach(t=>{
    const kids = isGuard(t) ? pRows.filter(isGuard) : pRows.filter(p=>p.parentId===t.kpiId);
    t.kids = kids.length;
    const sc = kids.filter(p=>numRate(p.rate)!==null);
    t.rate = !sc.length ? null : isGuard(t) ? sc.reduce((a,p)=>a+p.rate,0)
                                           : sc.reduce((a,p)=>a+p.rate,0)/sc.length;
  });
  const rp = people.filter(p=>p.rate!==null);
  const rate = rp.length ? rp.reduce((a,p)=>a+p.rate,0)/rp.length : null;
  const blank = pRows.filter(r=>numRate(r.rate)===null).length;
  const wBad = people.filter(p=>Math.round(p.wsum)!==100).length;
  return {team, tRows, pRows, people, rate, blank, wBad, written: pRows.length>0};
}
const allStats = () => state.data.teams.map(t=>({...t, ...teamStats(t.team)}));

/* ---------- 렌더 ---------- */
function gauge(v, cls, sm, label){
  const w = v===null?0:Math.min(100, Math.max(0,v)/120*100);
  const aria = v===null ? 'aria-label="진도율 미기재"'
    : `role="img" aria-label="${label?esc(label)+" ":""}진도율 ${pct(v)}, ${BAND_KO[cls]||""}, 목표 100%"`;
  return `<div class="gauge${sm?" sm":""}" ${aria}>`+
    `<u class="b1"></u><u class="b2"></u><u class="b3"></u>`+
    `<i class="fill-${cls}" style="width:${w}%"></i><b></b></div>`;
}

function moneyCard(m, hero){
  const b=band(m.rate);
  const noGoal = !m.annual;
  /* 이 카드는 연간(1~12월) 기준이다 — 팀/개인 목표(하반기 KPI)와는 별개 주기다. */
  return `<div class="stat${hero?" hero":""}">
    <div class="eyebrow">연간 ${esc(HEADLINE_LABEL[m.name] || m.name.replace(" 합계",""))}</div>
    <div class="st">
      <div class="big num" style="color:${noGoal?"var(--ink-3)":col(b)}">${
        noGoal?"—":pct(m.rate).replace("%","")}<small>%</small></div>
      <div class="goal"><b>${noGoal?"목표 미설정":fmt(m.annual)+" "+esc(m.unit)}</b>
        실적 ${m.actual==null?"미기재":fmt(m.actual)}</div>
    </div>
    <div class="gwrap">${gauge(noGoal?null:m.rate, b, false, m.name)}</div>
    ${noGoal?`<div class="cap" style="color:var(--warn)">시트 05_전사지표 탭의 연간 목표 칸이 비어 있습니다</div>`
            :`<div class="cap">시트 05_전사지표 탭 연동</div>`}
  </div>`;
}
function renderTotal(S){
  const sc=S.filter(s=>s.rate!==null);
  const head=sc.length?sc.reduce((a,s)=>a+s.rate,0)/sc.length:null;
  const all=state.data.rows.filter(r=>r.level==="개인");
  const filled=all.filter(r=>numRate(r.rate)!==null).length;
  const inRate=all.length?filled/all.length*100:null;
  const people=new Set(all.map(r=>r.team+"|"+r.owner)).size;
  const guards=all.filter(isGuard);
  const ded=guards.reduce((s,r)=>s+(numRate(r.rate)||0),0);
  const viol=guards.filter(r=>Number(r.actual)>0).length;
  document.getElementById("total").innerHTML=`
    <div class="stat hero">
      <div class="eyebrow">전사 평균 진도율</div>
      <div class="st">
        <div class="big num" style="color:${col(band(head))}">${
          head===null?"—":pct(head).replace("%","")}<small>%</small></div>
        <div class="goal"><b>${S.length}개 팀 · ${people}명</b>실적 입력 팀 ${sc.length}개</div>
      </div>
      <div class="gwrap">${gauge(head, band(head), false, "전사 평균")}</div>
      <div class="scale">
        <span><i style="background:var(--band-bad)"></i>70% 미만 미흡</span>
        <span><i style="background:var(--band-ok)"></i>70~90% 보통</span>
        <span><i style="background:var(--band-good)"></i>90% 이상 양호</span>
        <span class="tickleg"><i></i>목표 100%</span>
      </div>
    </div>
    <div class="stat">
      <div class="eyebrow">이번 주 실적 입력률</div>
      <div class="st">
        <div class="big num" style="color:${col(inRate===null?"idle":inRate>=90?"good":inRate>=50?"warn":"crit")}">${
          inRate===null?"—":Math.round(inRate)}<small>%</small></div>
        <div class="goal"><b>KPI ${all.length}개 중 ${filled}개</b>각 팀 탭의 주차 칸</div>
      </div>
    </div>
    <div class="stat">
      <div class="eyebrow">가드레일</div>
      <div class="st">
        <div class="big num" style="color:${col(ded<0?"crit":"good")}">${ded<0?pct(ded).replace("%",""):"0"}<small>%p</small></div>
        <div class="goal"><b>위반 항목 ${viol}개</b>가드레일 ${guards.length}개 운영 중</div>
      </div>
    </div>`;
}

/* ---------- 매출 추이 (OEM / IDENEL / 합계) 꺾은선 ---------- */
const MONTH_LABELS = ["1월","2월","3월","4월","5월","6월","7월","8월","9월","10월","11월","12월"];
/* axis:"L" = 좌축(매출), axis:"R" = 우축(영업이익).
   영업이익은 매출의 5% 수준이라 같은 축에 두면 X축에 붙어 추이가 보이지 않는다.
   우측 축을 따로 두고 점선 + 중립색으로 '다른 측정치'임을 드러낸다. */
const CHART_SERIES = [
  { key: "전사 매출 합계",   label: "매출 합계", token: "--series-1", axis:"L" },
  { key: "OEM 매출",         label: "OEM",       token: "--series-2", axis:"L" },
  { key: "IDENEL 매출",      label: "IDENEL",    token: "--series-3", axis:"L" },
  { key: "전사 영업이익 합계", label: "영업이익",   token: "--series-profit",
    axis:"R", dash:true },
];
function fmtM(v){ return v==null ? "—" : fmt(v)+" 백만원"; }
/* 눈금 간격을 1·2·2.5·5 × 10^n 으로 잡고 상단값을 그 배수로 맞춘다.
   눈금이 0 / 2,000 / 4,000 처럼 읽기 좋은 수로 떨어진다. */
function niceAxis(max, steps){
  if(!(max>0)) return steps;
  const raw = max/steps;
  const e = Math.pow(10, Math.floor(Math.log10(raw)));
  const m = raw/e;
  const step = (m<=1?1:m<=2?2:m<=2.5?2.5:m<=5?5:10)*e;
  return step*steps;
}

/* ---------- 주차별 진도율 추이 ----------
   각 주차 시점의 '그때까지 마지막으로 입력된 실적'으로 달성률을 다시 계산해
   지금 화면과 같은 규칙(개인 → 팀 평균 → 그룹·전사 평균)으로 집계한다. */
function rateAt(r, w){
  let a=null;
  for(let i=0;i<=w;i++) if(r.weeks && r.weeks[i]!=null) a=r.weeks[i];
  if(a===null) return null;
  const c=rateOf({...r, actual:a, sheetRate:undefined});
  return typeof c==="number" ? c : null;
}
const avgOf = xs => { const v=xs.filter(x=>x!==null); return v.length ? v.reduce((a,b)=>a+b,0)/v.length : null; };
function weekSeries(){
  const pRows=state.data.rows.filter(r=>r.level==="개인" && r.name);
  const last=Math.max(-1, ...pRows.map(r=>(r.weeks||[]).reduce((m,v,i)=>v!=null?i:m,-1)));
  const out=[];
  for(let w=0; w<=last; w++){
    const people={};
    pRows.forEach(r=>{ (people[r.team+"|"+r.owner] ??= []).push({...r, rate:rateAt(r,w)}); });
    const teamRate={};
    Object.values(people).forEach(rs=>{ const pr=personRate(rs);
      if(pr!==null) (teamRate[rs[0].team] ??= []).push(pr); });
    const team={}; Object.keys(teamRate).forEach(t=>team[t]=avgOf(teamRate[t]));
    const group={}; CAMPUS_ORDER.forEach(c=>{
      group[c]=avgOf(state.data.teams.filter(t=>t.campus===c).map(t=>team[t.team]??null)); });
    out.push({w, label:WEEK_LABELS[w], all:avgOf(Object.values(team)), group, team});
  }
  return out;
}
const TEAM_COLORS=["#6C4BD8","#E07A2E","#1F9D6B","#D14B7C","#2F7DD1","#B08A12",
                   "#7A5C3E","#13A3B5","#9A3FB0","#5E8C1F","#C2412D"];
function renderChart(){
  const el=document.getElementById("revChart"); if(!el) return;
  const S=weekSeries();
  const mode=state.chartMode||"group";
  const series=[{key:"전사", color:"var(--ink)", width:3, get:p=>p.all}];
  if(mode==="group") CAMPUS_ORDER.forEach(c=>series.push(
      {key:c+" 그룹", color:`var(${CAMPUS_VAR[c]})`, width:2, get:p=>p.group[c]}));
  else state.data.teams.forEach((t,i)=>series.push(
      {key:t.team, color:TEAM_COLORS[i%TEAM_COLORS.length], width:1.6, get:p=>p.team[t.team]??null}));
  const W=760,H=250,L=40,R=16,T=14,B=28, n=WEEK_LABELS.length;
  const x=i=>L+(W-L-R)*i/(n-1), y=v=>T+(H-T-B)*(1-Math.min(120,Math.max(0,v))/120);
  const grid=[0,30,60,90,120].map(v=>`<line class="grid" x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}"/>
      <text class="tick" x="${L-6}" y="${y(v)+3.5}" text-anchor="end">${v}%</text>`).join("");
  const goal=`<line x1="${L}" x2="${W-R}" y1="${y(100)}" y2="${y(100)}" stroke="var(--good)" stroke-dasharray="5 4" stroke-width="1.3"/>
      <text class="tick" x="${L+6}" y="${y(100)-5}" text-anchor="start" style="fill:var(--good)">목표 100%</text>`;
  const xt=WEEK_LABELS.map((l,i)=>`<text class="tick" x="${x(i)}" y="${H-8}" text-anchor="middle">${l}</text>`).join("");
  const lines=series.map(s=>{
    const pts=S.map(p=>({i:p.w,v:s.get(p)})).filter(p=>p.v!==null);
    if(!pts.length) return "";
    const d=pts.map((p,k)=>`${k?"L":"M"}${x(p.i).toFixed(1)},${y(p.v).toFixed(1)}`).join("");
    return `<path class="line" d="${d}" stroke="${s.color}" stroke-width="${s.width}"/>`+
      pts.map(p=>`<circle class="dot" cx="${x(p.i)}" cy="${y(p.v)}" r="${s.width+1}" fill="${s.color}"/>`).join("");
  }).join("");
  const hits=WEEK_LABELS.map((_,i)=>`<rect class="hit" data-w="${i}" x="${x(i)-(W-L-R)/(n-1)/2}" y="${T}"
      width="${(W-L-R)/(n-1)}" height="${H-T-B}"/>`).join("");
  const legend=series.map(s=>`<span class="key"><span class="swatch" style="background:${s.color};height:${s.width}px"></span>${esc(s.key)}</span>`).join("");
  const latest=S.length?S[S.length-1]:null, prev=S.length>1?S[S.length-2]:null;
  const delta=(latest&&prev&&latest.all!==null&&prev.all!==null)?latest.all-prev.all:null;
  el.style.display="";
  el.innerHTML=`<div class="chd"><h2>주차별 진도율 추이${latest&&latest.all!==null?` · ${latest.label}주 전사 ${pct(latest.all)}`:""}${
      delta!==null?` <span style="color:${delta>=0?"var(--good)":"var(--crit)"}">(${delta>=0?"▲":"▼"} ${Math.abs(delta).toFixed(1)}%p)</span>`:""}</h2>

function bringToFront(el){

function openPanel(kpiId){
  const existing = state.panels.get(kpiId);
  if(existing){ bringToFront(existing); existing.querySelector(".mclose").focus(); return; }
  const r = kpiId.startsWith("P|")
    ? (state.stats||allStats()).flatMap(s=>s.people).find(p=>p.kpiId===kpiId)
    : state.data.rows.find(x=>x.kpiId===kpiId);
  if(!r) return;

  const el = document.createElement("section");
  el.className = "panel";
  el.setAttribute("role","dialog");
  el.setAttribute("aria-label", `${r.team} ${r.name} 상세`);
  el.dataset.kpi = kpiId;

  // 열 때마다 조금씩 어긋나게 놓아 겹쳐도 헤더가 보이게 한다
  const w = Math.min(430, innerWidth-28);
  const step = 26, n = state.cascade++ % 8;
  const left = Math.min(innerWidth - w - 14, 46 + n*step);
  const top  = Math.min(innerHeight - 160, 92 + n*step);
  el.style.left = Math.max(10,left)+"px";
  el.style.top  = Math.max(10,top)+"px";

  el.innerHTML = `<div class="mhead">
      <span class="grip" aria-hidden="true"></span>
      <div class="mt"><div class="mkicker">${esc(r.team)} · ${esc(r.level==="팀"?r.kpiId:r.level==="사람"?"구성원":(r.kind||"개인 KPI"))}</div>
        <h2 class="mtitle">${esc(r.name)}</h2></div>
      <button class="mclose" type="button" aria-label="${esc(r.name)} 창 닫기">✕</button>
    </div>
    <div class="mbody">${panelBody(r)}</div>`;

  panels.appendChild(el);
  state.panels.set(kpiId, el);
  bringToFront(el);
  el.querySelector(".mclose").addEventListener("click",()=>closePanel(kpiId));
  el.addEventListener("pointerdown",()=>bringToFront(el));

  updatePanelInfo();
  markDup();
}

/* 헤더를 잡아 이동. 마우스가 없어도 쓸 수 있게 방향키 이동도 지원한다. */
function makeDraggable(el, handle){
  let sx=0, sy=0, ox=0, oy=0, dragging=false;
  handle.addEventListener("pointerdown", e=>{
    if(e.target.closest("button")) return;
    dragging=true; sx=e.clientX; sy=e.clientY;
    ox=parseFloat(el.style.left)||0; oy=parseFloat(el.style.top)||0;
    handle.setPointerCapture(e.pointerId);
    bringToFront(el);
  });
  handle.addEventListener("pointermove", e=>{
    if(!dragging) return;
    e.preventDefault();
    move(ox + e.clientX - sx, oy + e.clientY - sy);
  });
  const stop = e=>{ dragging=false;
    try{ handle.releasePointerCapture(e.pointerId); }catch(_){} };
  handle.addEventListener("pointerup", stop);
  handle.addEventListener("pointercancel", stop);

  handle.tabIndex = 0;
  handle.setAttribute("role","button");
  handle.setAttribute("aria-label","창 위치 이동 — 방향키로 옮길 수 있습니다");
  handle.addEventListener("keydown", e=>{
    const d = e.shiftKey ? 40 : 12;
    const x=parseFloat(el.style.left)||0, y=parseFloat(el.style.top)||0;
    if(e.key==="ArrowLeft") move(x-d,y); else if(e.key==="ArrowRight") move(x+d,y);
    else if(e.key==="ArrowUp") move(x,y-d); else if(e.key==="ArrowDown") move(x,y+d);
    else return;
    e.preventDefault(); bringToFront(el);
  });
  function move(x,y){
    const w=el.offsetWidth, h=el.offsetHeight;
    el.style.left = Math.max(4, Math.min(innerWidth - w - 4, x)) + "px";
    el.style.top  = Math.max(4, Math.min(innerHeight - Math.min(h,120) - 4, y)) + "px";
  }
}

}));

/* ---------- CSV → rows ---------- */
function parseCSV(text){
  const out=[]; let row=[], f="", q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){f+='"';i++;} else q=false; } else f+=c; }
    else if(c==='"') q=true;
    else if(c===","){ row.push(f); f=""; }
    else if(c==="\n"){ row.push(f); out.push(row); row=[]; f=""; }
    else if(c!=="\r") f+=c;
  }
  if(f||row.length){ row.push(f); out.push(row); }
  return out.filter(r=>r.some(v=>v!==""));
}
/* 'KPI 관리' 탭(개인 KPI)과 '팀 KPI' 탭을 읽는다. 열 순서가 바뀌어도 헤더 이름으로 찾는다. */
const PMAP={그룹:"campus",팀:"team",파트:"part",이름:"owner",구분:"kind",KPI:"name",유형:"type",
  "기준선(설명)":"baseText","목표(설명)":"targetText",목표값:"target",기준선값:"low",
  "감점률(%p)":"ded",비중:"weight","상위 팀KPI":"parentId","데이터 원천":"src",
  "최신 실적":"actual",달성률:"sheetRate",점수:"score"};
const TMAP={그룹:"campus",팀:"team",ID:"kpiId",KPI:"name",유형:"type",기준선:"baseText",
  목표:"targetText",산식:"why",책임자:"owner"};
const SMAP={그룹:"campus",팀:"team",팀장:"lead","운영 상태":"status","이번 주 이슈·메모":"memo",업데이트일:"updated"};
const NUMF=new Set(["target","low","ded","weight","actual","sheetRate","score"]);
const toNum = v => { const n=Number(String(v).replace(/[,%]/g,"")); return isNaN(n)?null:n; };
function rowsFrom(text, map, level){
  const t=parseCSV(text);
  if(t.length<2) return [];
  const head=t[0].map(h=>h.trim());
  const wk = head.map((h,i)=>/주$/.test(h)?i:-1).filter(i=>i>=0);
  const cnt={};
  return t.slice(1).map(r=>{
    const o={level};
    head.forEach((h,i)=>{ const k=map[h]; if(!k) return;
      const v=(r[i]??"").trim();
      o[k] = v==="" ? null : (NUMF.has(k) ? toNum(v) : v);
    });
    if(level==="개인"){
      o.weeks = wk.map(i=>{ const v=(r[i]??"").trim(); return v===""?null:toNum(v); });
      const key=o.team+"|"+o.owner; cnt[key]=(cnt[key]||0)+1;
      o.kpiId = `${key}|${cnt[key]}`;
    }
    return o;
  }).filter(o=>o.team && (o.name || level==="현황"));
}
const tabUrl = (id,tab,range) =>
  `https://docs.google.com/spreadsheets/d/${id}/gviz/tq?tqx=out:csv&headers=1&sheet=${
    encodeURIComponent(tab)}&range=${range}`;
async function fetchCsv(u){
  const r=await fetch(u);
  if(!r.ok) throw new Error("HTTP "+r.status);
  return r.text();
}
async function fromSheets(id){
  const pRows = rowsFrom(await fetchCsv(tabUrl(id,"전체 KPI","A1:AA1000")), PMAP, "개인");
  if(!pRows.length) throw new Error("'전체 KPI' 탭에 KPI 행이 없습니다");
  let tRows=[];
  try{ tRows = rowsFrom(await fetchCsv(tabUrl(id,"팀 KPI","A1:I200")), TMAP, "팀"); }
  catch(e){ console.warn("'팀 KPI' 탭을 읽지 못했습니다 —", e.message); }
  const rows=[...tRows, ...pRows];
  rows.forEach(r=>{ if(r.level!=="개인") return; const c=rateOf(r);
    r.rate = typeof c==="number"?c:null; r.rateNote = typeof c==="string"?c:null; });
  /* 팀장·운영 상태·메모는 시트 '팀 현황' 탭에서 바로 고친다 (SR 때처럼 HTML 수정·재배포 불필요) */
  let teams=[];
  try{ teams = rowsFrom(await fetchCsv(tabUrl(id,"팀 현황","A1:H100")), SMAP, "현황")
         .map(t=>({team:t.team, campus:t.campus, lead:t.lead||"", status:t.status||"", memo:t.memo||"", updated:t.updated||"", n:0})); }
  catch(e){ console.warn("'팀 현황' 탭을 읽지 못했습니다 —", e.message); }
  rows.forEach(r=>{ if(!teams.find(t=>t.team===r.team))
    teams.push({team:r.team, campus:r.campus, lead:"", n:0}); });
  teams.forEach(t=>{
    t.lead = t.lead || (rows.find(r=>r.team===t.team && r.level==="팀")||{}).owner || "";
    t.n = new Set(rows.filter(r=>r.team===t.team && r.level==="개인").map(r=>r.owner)).size;
  });
  return {period:DATA.period, asOf:new Date().toISOString().slice(0,10), teams, rows};
}
async function loadSheet(){
  const raw=document.getElementById("sheetUrl").value.trim();
  if(!raw) return;
  const dot=document.getElementById("srcDot"), txt=document.getElementById("srcText");
  const btn=document.getElementById("loadBtn");
  const id=(raw.match(/\/d\/([a-zA-Z0-9-_]{20,})/)||[,raw])[1];
  dot.className="dot busy"; txt.textContent="불러오는 중…"; btn.disabled=true;
  try{
    state.data=await fromSheets(id);
    closeAllPanels();
    collapseAll();
    dot.className="dot live";
    txt.textContent=`시트 연동 · 개인 KPI ${state.data.rows.filter(r=>r.level==="개인").length}개 · 팀 KPI ${
      state.data.rows.filter(r=>r.level==="팀").length}개`;
    render();
    state.loaded = true;
    try{ localStorage.setItem(LS_KEY, raw); }catch(e){}
  }catch(e){
    dot.className="dot err";
    txt.textContent = (e instanceof TypeError)
      ? "이 사본에서는 외부 요청이 차단됩니다 — 내려받은 HTML 파일에서 사용하세요"
      : /HTTP 404/.test(e.message)
        ? "불러오기 실패 (404) — 시트 ID가 잘못되었거나 탭 이름이 'KPI 관리'가 아닙니다"
        : /HTTP 40[13]/.test(e.message)
        ? `불러오기 실패 (${e.message}) — 시트 공유를 '링크가 있는 모든 사용자: 뷰어'로 바꿔주세요`
        : `불러오기 실패 — ${e.message}`;
    /* 실 배포본(시트 ID가 박힌 사본)에서 불러오기가 실패하면 내장 샘플 데이터를
       그대로 두면 안 된다. 가상 숫자가 실제 실적처럼 읽힌다. 비우고 '미작성'으로
       떨어뜨려, 화면에 남는 값이 전부 시트에서 온 것임을 보장한다. */
    console.error(e);
  }finally{ btn.disabled=false; }
}

updatePanelInfo();
document.getElementById("loadBtn").addEventListener("click",loadSheet);
document.getElementById("sheetUrl").addEventListener("keydown",e=>{ if(e.key==="Enter") loadSheet(); });
/* 자동 연동: 이 기기에서 예전에 불러온 시트가 있으면 그걸, 없으면 DEFAULT_SHEET_ID를 자동으로 불러온다. */
(function bootstrapSheet(){
  let saved=""; try{ saved=localStorage.getItem(LS_KEY)||""; }catch(e){}
  const src = DEFAULT_SHEET_ID || saved;
  if(!src) return;
  document.getElementById("sheetUrl").value = src;
  loadSheet();
})();
document.getElementById("themeBtn").addEventListener("click",()=>{
  const r=document.documentElement;
  const dark=r.getAttribute("data-theme")==="dark" ||
    (!r.getAttribute("data-theme") && matchMedia("(prefers-color-scheme:dark)").matches);
  r.setAttribute("data-theme", dark?"light":"dark");
});
render();
</script>
